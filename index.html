<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Check: APA Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEE9FF; --ink:#1D1838; --muted:#5B5580; --card:#FFFFFF; --line:#CFC6F5;
  --pink:#E8256F; --blue:#3047FF; --lemon:#F4FF5E; --on-lemon:#1D1838;
  --good:#0E8A55; --bad:#D3203F; --paper:#FFFFFF; --paper-ink:#1A1A1A;
  --shadow:6px 6px 0 var(--ink);
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --serif:"Times New Roman", Times, Georgia, serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17132B; --ink:#F2EEFF; --muted:#ABA4D2; --card:#241E42; --line:#3D3566;
    --pink:#FF5C9E; --blue:#8592FF; --good:#3DD68C; --bad:#FF6B81;
    --shadow:6px 6px 0 #000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17132B; --ink:#F2EEFF; --muted:#ABA4D2; --card:#241E42; --line:#3D3566;
  --pink:#FF5C9E; --blue:#8592FF; --good:#3DD68C; --bad:#FF6B81;
  --shadow:6px 6px 0 #000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--line) 1.2px, transparent 1.2px);background-size:22px 22px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);}
.hud-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.rounds{display:flex;gap:6px}
.rd{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;background:var(--card)}
.rd.on{background:var(--lemon);color:var(--on-lemon)}
.rd.done{background:var(--ink);color:var(--bg)}
.aura{margin-left:auto;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.aura small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.combo{font-family:var(--display);font-weight:800;font-size:14px;padding:3px 10px;border-radius:99px;background:var(--pink);color:#fff;opacity:0;transition:opacity .2s}
.combo.show{opacity:1}
.icon-btn{border:2px solid var(--ink);background:var(--card);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}

main{max-width:760px;margin:0 auto;padding:24px 16px 60px}

/* shared pieces */
.btn{font-family:var(--display);font-weight:800;font-size:18px;border:2.5px solid var(--ink);border-radius:14px;padding:12px 22px;background:var(--lemon);color:var(--on-lemon);box-shadow:4px 4px 0 var(--ink);transition:transform .08s, box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}
.panel{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:24px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0}
.kicker{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px;margin:0 0 6px}
.cite{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--paper-ink)}
.cite-box{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:18px 20px 18px 20px}
.cite-box .cite{padding-left:1.6em;text-indent:-1.6em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* title screen */
.title-wrap{text-align:center;padding-top:10px}
.mega{font-size:clamp(56px,15vw,124px);font-weight:800;letter-spacing:-.04em;line-height:.86}
.mega .l1{display:block;color:var(--ink)}
.mega .l2{display:inline-block;background:var(--pink);color:#fff;padding:2px 18px 10px;border:3px solid var(--ink);border-radius:18px;transform:rotate(-3deg);box-shadow:var(--shadow);margin-top:10px}
.sub{font-size:19px;max-width:30em;margin:30px auto 8px}
.stickers{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0 30px}
.sticker{border:2px solid var(--ink);border-radius:99px;padding:6px 14px;background:var(--card);font-weight:700;font-size:15px}
.sticker:nth-child(2){transform:rotate(2deg);background:var(--lemon);color:var(--on-lemon)}
.sticker:nth-child(3){transform:rotate(-2deg)}
.sticker:nth-child(4){transform:rotate(1.5deg);background:var(--blue);color:#fff}

/* briefing */
.brief h2{font-size:clamp(34px,7vw,52px);letter-spacing:-.02em;margin-bottom:6px}
.brief .lede{color:var(--muted);margin:0 0 18px}
.rules{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px}
.rules li{border-left:5px solid var(--pink);padding:4px 0 4px 14px}
.rules b{font-family:var(--display)}
.anatomy{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 20px}
.anatomy span{border:2px solid var(--ink);border-radius:8px;padding:4px 10px;font-weight:700;font-size:15px;background:var(--bg)}

/* round 1 swipe */
.deck{position:relative;min-height:260px;margin:10px 0 18px;touch-action:pan-y}
.swipe{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:22px;user-select:none;touch-action:pan-y;cursor:grab}
.swipe.dragging{cursor:grabbing;transition:none}
.swipe .tag{position:absolute;top:16px;font-family:var(--display);font-weight:800;font-size:28px;padding:2px 12px;border:3px solid;border-radius:10px;opacity:0;transform:rotate(-8deg)}
.swipe .tag.v{right:16px;color:var(--good);border-color:var(--good);transform:rotate(8deg)}
.swipe .tag.s{left:16px;color:var(--bad);border-color:var(--bad)}
.counter{font-family:var(--display);font-weight:600;color:var(--muted);margin-bottom:12px}
.choices{display:flex;gap:14px;justify-content:center}
.choices .btn{min-width:140px}
.verdict{margin-top:16px;border:2.5px solid var(--ink);border-radius:16px;padding:16px 18px;background:var(--card)}
.verdict h3{font-size:24px;margin-bottom:6px}
.verdict.good h3{color:var(--good)}
.verdict.bad h3{color:var(--bad)}
.verdict p{margin:0 0 12px}
.fly-left{transition:transform .35s ease-in, opacity .35s;transform:translateX(-140%) rotate(-18deg)!important;opacity:0}
.fly-right{transition:transform .35s ease-in, opacity .35s;transform:translateX(140%) rotate(18deg)!important;opacity:0}

/* round 2 build */
.slots{min-height:110px;background:var(--paper);border:2px dashed var(--ink);border-radius:14px;padding:16px 18px;margin:10px 0 16px}
.slots .cite{padding-left:1.6em;text-indent:-1.6em}
.slots .ph{color:#8a85a6;font-family:var(--body);font-size:15px}
.slots .pc{background:#FFF7A8;border-radius:4px;padding:0 2px;animation:pop .3s}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{font-family:var(--serif);font-size:17px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:3px 3px 0 var(--ink);max-width:100%;overflow-wrap:anywhere}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tile.used{visibility:hidden}
.order-hint{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.order-hint span{font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px;border:2px solid var(--line);color:var(--muted)}
.order-hint span.now{border-color:var(--ink);background:var(--lemon);color:var(--on-lemon)}
.order-hint span.done{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* round 3 page */
.page-wrap{overflow-x:auto;margin:10px 0 16px}
.page{position:relative;background:var(--paper);color:var(--paper-ink);border:2px solid var(--ink);box-shadow:var(--shadow);border-radius:4px;padding:56px 48px 60px;min-width:520px;font-family:var(--serif);font-size:16px;line-height:2}
.hot{cursor:pointer;border-radius:4px;outline:2px dashed transparent;transition:outline-color .15s, background .15s}
.hot:hover{outline-color:#9b93d6}
.hot.found{background:#FFE1EC;outline:2px solid var(--pink)}
.hot.cleared{background:#E2F7EC;outline:2px solid #0E8A55}
.p-num{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:0 8px}
.p-head{margin:0 0 4px;font-weight:400;padding:0 6px}
.entry{display:block;padding-left:.5in;text-indent:-.5in;margin:0}
.entry.bad-indent{padding-left:0;text-indent:.5in}
.found-count{font-family:var(--display);font-weight:800;font-size:20px}
.note{margin-top:12px;border:2.5px solid var(--ink);border-radius:14px;padding:14px 16px;background:var(--card);min-height:60px}
.note.good{border-color:var(--good)}
.note.bad{border-color:var(--bad)}

/* round 4 quiz */
.timer{height:14px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--card);margin:6px 0 18px}
.timer i{display:block;height:100%;background:var(--blue);width:100%}
.timer.low i{background:var(--pink)}
.q{font-size:21px;font-weight:700;margin:0 0 16px}
.ctx{font-family:var(--serif);font-size:18px;background:var(--paper);color:var(--paper-ink);border:2px solid var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;font-family:var(--serif);font-size:18px;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:12px 16px;box-shadow:3px 3px 0 var(--ink)}
.opt .k{font-family:var(--display);font-weight:800;font-size:14px;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--bg);margin-right:10px;vertical-align:2px}
.opt.right{background:#D8F5E6;color:#0b3d27;border-color:#0E8A55}
.opt.wrong{background:#FFDDE3;color:#5c0e1c;border-color:#D3203F}
.opt:disabled{cursor:default}

/* end */
.end h2{font-size:clamp(40px,9vw,72px);letter-spacing:-.03em}
.rank{display:inline-block;margin:14px 0 4px;background:var(--lemon);color:var(--on-lemon);border:2.5px solid var(--ink);border-radius:12px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:22px;transform:rotate(-1.5deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{border:2px solid var(--ink);border-radius:14px;padding:12px;background:var(--bg);text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--paper-ink)}
#certCanvas{width:100%;height:auto;border:2.5px solid var(--ink);border-radius:12px;margin:16px 0;display:block}
textarea{width:100%;font-family:var(--body);font-size:15px;border:2px solid var(--ink);border-radius:12px;padding:10px;background:var(--paper);color:var(--paper-ink);resize:vertical}
.msg{min-height:1.5em;font-weight:700;margin-top:8px}

/* lesson */
.lprog{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lbar{flex:1;height:10px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--card)}
.lbar i{display:block;height:100%;background:var(--pink);transition:width .3s}
.lpart{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;white-space:nowrap}
.slide h2{font-size:clamp(30px,6vw,46px);letter-spacing:-.02em;margin-bottom:14px}
.slide p{margin:0 0 14px}
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{border:2px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:15px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mini{border:2px solid var(--ink);border-radius:14px;padding:14px;background:var(--bg)}
.mini b{font-family:var(--display);font-size:18px;display:block;margin-bottom:4px}
.aside{border-left:5px solid var(--blue);padding:4px 0 4px 14px;color:var(--muted)}
.sort-item{border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--card);margin-bottom:10px}
.sort-item p{margin:0 0 10px}
.sort-item .btn{font-size:15px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink)}
.sort-item .fb{margin:10px 0 0;font-weight:700}
.sort-item.ok{border-color:var(--good)}
.sort-item.no{border-color:var(--bad)}
.btn.picked:disabled{opacity:1}
.lit,mark{background:#FFE36B!important;color:#1A1A1A!important;border-radius:4px;outline:2px solid var(--pink)}
.tagbtn{background:none;border:0;padding:0 2px;font:inherit;color:inherit;text-decoration:underline wavy var(--pink);text-underline-offset:5px;cursor:pointer}
.explore{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:22px;align-items:start}
.mock{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:4px;aspect-ratio:8.5/11;width:100%;max-width:340px;padding:11.76%;box-shadow:var(--shadow);overflow:hidden;transition:background .2s}
.mock .pnum{position:absolute;top:5%;right:11.76%;font-family:var(--serif);font-size:11px;color:var(--paper-ink);padding:0 3px;border-radius:3px}
.mock-in{display:flex;flex-direction:column;gap:9px;height:100%;transition:background .2s}
.ln{display:block;height:4px;background:#B9B3D6;border-radius:3px;flex:none;transition:background .2s}
.ln.first{margin-left:9%}
.mock[data-z=margin]{background:repeating-linear-gradient(45deg,#FFD1E2 0 8px,#FFFFFF 8px 16px)}
.mock[data-z=margin] .mock-in{background:#FFFFFF;outline:2px dashed var(--pink)}
.mock[data-z=pnum] .pnum{background:#FFE36B;outline:2px solid var(--pink)}
.mock[data-z=spacing] .ln{background:var(--pink)}
.mock[data-z=indent] .ln.first{background:var(--pink)}
.mock[data-z=font] .ln{background:#3047FF}
.mock[data-z=align] .mock-in{box-shadow:-4px 0 0 var(--pink)}
.tp .mock-in{align-items:center;text-align:center;gap:0;font-family:var(--serif);font-size:11.5px;line-height:2;color:var(--paper-ink)}
.tp .spacer{height:15%;flex:none}
.tp .blank{height:2em;flex:none}
.hot2{cursor:pointer;padding:0 3px;border-radius:3px;outline:2px dashed transparent}
.hot2:hover{outline-color:#9b93d6}
.zbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.zbtn{border:2px solid var(--ink);border-radius:10px;padding:6px 12px;background:var(--card);font-weight:700;font-size:15px}
.zbtn.on{background:var(--lemon);color:var(--on-lemon)}
.zbtn.seen:not(.on)::after{content:" ✓"}
.head-demo p{margin:0;line-height:2;font-family:var(--serif);font-size:17px;color:var(--paper-ink)}
.h1d{text-align:center;font-weight:700}
.h2d{font-weight:700}
.h3d{font-weight:700;font-style:italic}
.pd{text-indent:.5in}
.part{cursor:pointer;border-bottom:3px solid;border-radius:2px}
.part[data-p=author]{border-color:#E8256F}
.part[data-p=date]{border-color:#3047FF}
.part[data-p=title]{border-color:#0E8A55}
.part[data-p=source]{border-color:#C98A00}
.part[data-p=doi]{border-color:#7A3FD1}
.part.active{background:#FFE36B}
.tblwrap{overflow-x:auto;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:16px;min-width:460px}
.tbl th,.tbl td{border:2px solid var(--ink);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-family:var(--display)}
.tbl td.c{font-family:var(--serif);background:var(--paper);color:var(--paper-ink)}
.ref-demo{background:var(--paper);color:var(--paper-ink);border:2px solid var(--ink);border-radius:6px;padding:20px 22px;font-family:var(--serif);font-size:15px;line-height:1.25;margin-bottom:14px}
.ref-demo.dbl{line-height:2}
.ref-h{text-align:center;font-weight:700;margin:0 0 6px!important}
.ref-e{margin:0 0 8px!important}
.ref-demo.dbl .ref-e{margin:0!important}
.ref-demo.hang .ref-e{padding-left:.5in;text-indent:-.5in}
.tpl{font-family:var(--serif);font-size:18px;background:var(--paper);color:var(--paper-ink);border:2px dashed var(--ink);border-radius:12px;padding:14px 18px;margin-bottom:10px}
@media (max-width:620px){.explore,.grid2{grid-template-columns:1fr}.mock{margin:0 auto}}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.popup{position:fixed;z-index:21;pointer-events:none;font-family:var(--display);font-weight:800;font-size:22px;color:var(--pink);text-shadow:2px 2px 0 var(--card);animation:floatUp 1s forwards}
.popup.neg{color:var(--bad)}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:560px){
  main{padding:18px 12px 50px}
  .panel{padding:18px}
  .cite{font-size:17px}
  .choices .btn{min-width:0;flex:1}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat b{font-size:22px}
  .aura{font-size:19px}
  .rd{width:26px;height:26px;font-size:13px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="hud">
  <div class="hud-in">
    <div class="rounds" aria-label="Round progress">
      <div class="rd" id="rdL" title="Lesson">L</div><div class="rd" id="rd1">1</div><div class="rd" id="rd2">2</div><div class="rd" id="rd3">3</div><div class="rd" id="rd4">4</div>
    </div>
    <span class="combo" id="combo">x2 streak</span>
    <div class="aura" aria-live="polite"><span id="auraVal">0</span><small>aura</small></div>
    <button class="icon-btn" id="muteBtn" aria-label="Mute sound" title="Sound on/off">🔊</button>
  </div>
</header>
<main id="stage"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="sr" aria-live="assertive" id="live"></div>

<script>
/* ===================== SCORE FORM SETUP =====================
   Paste your Google Form's pre-filled link between the quotes below.
   When making the pre-filled link, type these placeholders into the fields:
   NAME, AURA, ACCURACY, STREAK, RANK, LESSON, CODE
   Leave it empty to hide the "Send score" button. */
const FORM_PREFILL_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeu6TgnyCMUF3v3BaWbKwSMR6v5uFls6Xn_33b-muFwNu5iBQ/viewform?usp=pp_url&entry.676103810=Name&entry.20527842=Aura&entry.1650827382=Accuracy&entry.1344980306=Best+streak&entry.1840662580=Rank&entry.1359463616=Lesson&entry.646984047=Completion+code';

/* ===================== CONTENT (real published sources, APA 7) ===================== */
const ROUND1 = [

function tone(f,d,type='sine',t0=0,vol=.14,slide=null){
  const c=ac(); if(!c||muted)return;
  const t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.05);
}

function award(ok, base, el){
  S.attempts++;
  if(ok){
    S.correct++; S.streak++; S.best=Math.max(S.best,S.streak);
    const mult = S.streak>=6?3:S.streak>=3?2:1;
    const pts = base*mult;
    S.aura+=pts; popup('+'+pts+' aura',el,false);
    if(mult>1){sfx.streak(S.streak)}else{sfx.good()}
    showCombo(mult);
  } else {
    S.streak=0; const pts=Math.min(50,S.aura); S.aura-=pts;
    popup(pts?'−'+pts+' aura':'aura check failed',el,true); sfx.bad(); showCombo(1);
  }
  renderAura();
}
function renderAura(){
  const el=$('#auraVal'), target=S.aura, from=+el.dataset.v||0; el.dataset.v=target;
  if(reduceMotion){el.textContent=target.toLocaleString();return}
  const t0=performance.now();
  (function step(now){const p=Math.min(1,(now-t0)/400);el.textContent=Math.round(from+(target-from)*p).toLocaleString();if(p<1)requestAnimationFrame(step)})(t0);
}

function popup(text,el,neg){
  const p=document.createElement('div');p.className='popup'+(neg?' neg':'');p.textContent=text;

}

function confetti(n=140){
  if(reduceMotion)return;
  const cols=['#E8256F','#3047FF','#F4FF5E','#1D1838','#3DD68C'];
  for(let i=0;i<n;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,c:cols[i%cols.length],life:0});
  if(!fxOn){fxOn=true;requestAnimationFrame(drawFx)}
}
function drawFx(){
  const d=devicePixelRatio;fctx.setTransform(d,0,0,d,0,0);fctx.clearRect(0,0,innerWidth,innerHeight);
  bits.forEach(b=>{b.vy+=.35;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.life++;fctx.save();fctx.translate(b.x,b.y);fctx.rotate(b.r);fctx.fillStyle=b.c;fctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);fctx.restore()});
  bits=bits.filter(b=>b.y<innerHeight+40&&b.life<240);
  if(bits.length)requestAnimationFrame(drawFx);else{fxOn=false;fctx.clearRect(0,0,innerWidth,innerHeight)}
}

function lesson(i){
  setRound('L');document.onkeydown=null;
  const s=LESSON[i],n=LESSON.length;
  go(`<div class="lprog"><span class="lpart">${s.part}</span><div class="lbar"><i style="width:${(i+1)/n*100}%"></i></div><span class="lpart">${i+1} of ${n}</span></div>
    <section class="panel slide"><h2 tabindex="-1" data-focus>${s.title}</h2><div id="sbody">${s.html()}</div>
    <div class="lnav"><button class="btn alt" id="lBack">${i?'Back':'Title screen'}</button><button class="btn ${i===n-1?'pink':''}" id="lNext">${i===n-1?'Finish the lesson':'Next'}</button></div></section>`);
  const next=$('#lNext');
  if(s.once&&s._done){
    $('#sbody').innerHTML='<div class="verdict good"><h3>Already cleared.</h3><p>You finished this check. Keep going.</p></div>';
  } else {
    if(s.gate&&!s._done)next.disabled=true;
    if(s.init)s.init($('#sbody'),()=>{s._done=true;next.disabled=false;say('Next is unlocked.')});
  }
  $('#lBack').onclick=()=>{sfx.tap();i?lesson(i-1):titleScreen()};
  next.onclick=()=>{sfx.tap();i<n-1?lesson(i+1):lessonDone()};
}
function lessonDone(){
  S.lessonDone=true;sfx.win();confetti();setRound('L');$('#rdL').className='rd done';
  go(`<section class="panel brief" style="text-align:center">
    <p class="kicker">Lesson complete</p>
    <h2>Now prove it.</h2>
    <p class="lede" style="margin-top:10px">You’ve covered what APA is, how to set up the paper, how to build reference entries, and how to cite in your sentences. Four practice rounds are next. Running total: <b>${S.aura.toLocaleString()} aura</b>.</p>
    <button class="btn pink" id="goNext" data-focus>Start round 1</button>
  </section>`);
  $('#goNext').onclick=()=>{sfx.tap();brief1()};
}

/* ===================== ROUND 1 ===================== */
function brief1(){
  setRound(1);
  go(`<section class="panel brief">
    <p class="kicker">Round 1 of 4</p>
    <h2>Valid or sus</h2>
    <p class="lede">A reference entry has four parts, always in this order:</p>
    <div class="anatomy"><span>Author.</span><span>(Date).</span><span>Title.</span><span>Source.</span></div>
    <ul class="rules">
      <li><b>Authors:</b> last name, then initials. Use &amp; before the final author.</li>
      <li><b>Titles:</b> sentence case, so only the first word, the first word after a colon, and proper nouns get capitals.</li>
      <li><b>Italics:</b> book titles, journal names, and journal volume numbers.</li>
      <li><b>DOIs</b> are written as links: https://doi.org/… No city for publishers.</li>
    </ul>
    <p>Swipe right (or press →) if the entry is valid. Swipe left (or press ←) if something’s sus.</p>
    <button class="btn" id="go1" data-focus>Deal the cards</button>
  </section>`);
  $('#go1').onclick=()=>{sfx.tap();round1()};
}
function round1(){
  const cards=shuffle(ROUND1);let i=0,locked=false;
  function show(){
    if(i>=cards.length)return roundDone(1,brief2);
    locked=false;const c=cards[i];
    go(`<div class="counter">Card ${i+1} of ${cards.length}</div>
      <div class="deck"><div class="swipe" id="card" tabindex="0" aria-label="Reference entry. Press right arrow for valid, left arrow for sus.">
        <span class="tag s">SUS</span><span class="tag v">VALID</span>
        <div class="cite-box"><p class="cite" style="margin:0">${c.html}</p></div>
      </div></div>
      <div class="choices" id="choices"><button class="btn alt" id="susBtn">← Sus</button><button class="btn blue" id="valBtn">Valid →</button></div>
      <div id="vd"></div>`);
    $('#card').focus({preventScroll:true});
    $('#susBtn').onclick=()=>decide(false);
    $('#valBtn').onclick=()=>decide(true);
    drag($('#card'));
  }
  function drag(card){
    let sx=0,dx=0,down=false;
    const tv=card.querySelector('.tag.v'),ts=card.querySelector('.tag.s');
    card.addEventListener('pointerdown',e=>{if(locked)return;down=true;sx=e.clientX;dx=0;card.classList.add('dragging');card.setPointerCapture(e.pointerId)});
    card.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;tv.style.opacity=Math.max(0,dx/120);ts.style.opacity=Math.max(0,-dx/120)});
    const up=()=>{if(!down)return;down=false;card.classList.remove('dragging');
      if(Math.abs(dx)>100){decide(dx>0)}else{card.style.transition='transform .2s';card.style.transform='';tv.style.opacity=0;ts.style.opacity=0;setTimeout(()=>card.style.transition='',200)}};
    card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);
  }
  function decide(saidValid){
    if(locked)return;locked=true;
    const c=cards[i],ok=saidValid===c.valid,card=$('#card');
    sfx.swoosh();
    card.querySelector(saidValid?'.tag.v':'.tag.s').style.opacity=1;
    award(ok,100,card);
    $('#choices').style.display='none';
    const title=ok?(c.valid?'Valid. You’re right.':'Sus. Good catch.'):(c.valid?'Actually, this one was valid.':'Missed it. This one was sus.');
    $('#vd').innerHTML=`<div class="verdict ${ok?'good':'bad'}"><h3>${title}</h3><p>${c.why}</p><button class="btn" id="nextBtn">Next card</button></div>`;
    say(title+' '+$('#vd p').textContent);
    $('#nextBtn').focus({preventScroll:true});
    $('#nextBtn').onclick=()=>{card.classList.add(saidValid?'fly-right':'fly-left');setTimeout(()=>{i++;show()},reduceMotion?0:300)};
  }
  document.onkeydown=e=>{
    if(!$('#card'))return;
    if(!locked&&e.key==='ArrowRight'){e.preventDefault();decide(true)}
    else if(!locked&&e.key==='ArrowLeft'){e.preventDefault();decide(false)}
  };
  show();
}

/* ===================== ROUND 2 ===================== */
function brief2(){
  setRound(2);document.onkeydown=null;
  go(`<section class="panel brief">
    <p class="kicker">Round 2 of 4</p>
    <h2>Build the reference</h2>
    <p class="lede">Each pile has the pieces of one real reference, plus one piece that doesn’t belong.</p>
    <ul class="rules">
      <li><b>Tap the pieces in order:</b> author, date, title, source, then DOI if there is one.</li>
      <li><b>One piece is a trap.</b> Tap it and you lose aura. Leave it in the pile.</li>
      <li><b>Journal articles</b> end with the journal, volume, issue, pages, and DOI. <b>Books</b> end with the publisher.</li>
    </ul>
    <button class="btn" id="go2" data-focus>Open the first pile</button>
  </section>`);
  $('#go2').onclick=()=>{sfx.tap();round2()};
}
function round2(){
  let r=0;
  function show(){
    if(r>=ROUND2.length)return roundDone(2,brief3);
    const it=ROUND2[r];let step=0;
    const pool=shuffle([...it.parts.map((p,idx)=>({...p,idx})),...it.decoys.map(d=>({...d,idx:-1}))]);
    go(`<div class="counter">Pile ${r+1} of ${ROUND2.length}: ${it.label}</div>
      <div class="order-hint" id="hint">${it.parts.map((p,k)=>`<span data-k="${k}">${p.k}</span>`).join('')}</div>
      <div class="slots" id="slots"><p class="cite" style="margin:0" id="built"><span class="ph">Tap the first piece below.</span></p></div>
      <div class="tiles" id="tiles">${pool.map((p,k)=>`<button class="tile" data-i="${k}">${p.t}</button>`).join('')}</div>
      <div id="vd"></div>`);
    const built=$('#built');
    function hint(){document.querySelectorAll('#hint span').forEach((s,k)=>s.className=k<step?'done':k===step?'now':'')}
    hint();
    document.querySelectorAll('.tile').forEach(btn=>btn.onclick=()=>{
      const p=pool[+btn.dataset.i];
      if(p.idx===step){
        if(step===0)built.innerHTML='';
        built.insertAdjacentHTML('beforeend',(step?' ':'')+`<span class="pc">${p.t}</span>`);
        btn.classList.add('used');btn.disabled=true;step++;hint();award(true,60,btn);
        $('#vd').innerHTML='';
        if(step===it.parts.length){
          document.querySelectorAll('.tile').forEach(b=>b.disabled=true);
          confetti(60);
          $('#vd').innerHTML=`<div class="verdict good"><h3>Built clean.</h3><p>That’s the full ${it.label.toLowerCase()} reference in APA 7.</p><button class="btn" id="nextBtn">${r+1<ROUND2.length?'Next pile':'Finish round'}</button></div>`;
          $('#nextBtn').focus({preventScroll:true});$('#nextBtn').onclick=()=>{r++;show()};
        }
      } else {
        award(false,0,btn);btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');
        const msg=p.idx===-1?p.why:`Not yet. The next piece is the ${it.parts[step].k.toLowerCase()}.`;
        $('#vd').innerHTML=`<div class="verdict bad"><h3>${p.idx===-1?'That’s the trap.':'Wrong order.'}</h3><p>${msg}</p></div>`;
        say(msg);
      }
    });
  }
  show();
}

/* ===================== ROUND 3 ===================== */
function brief3(){
  setRound(3);
  go(`<section class="panel brief">
    <p class="kicker">Round 3 of 4</p>
    <h2>Spot the glitches</h2>
    <p class="lede">This References page from a student paper has ${ROUND3_GLITCHES} formatting errors. Tap each one.</p>
    <ul class="rules">
      <li><b>The heading</b> is “References,” bold and centered.</li>
      <li><b>Page numbers</b> go in the top right corner of every page.</li>
      <li><b>Entries</b> are alphabetical by first author, double-spaced, with a 0.5-inch hanging indent (first line flush left, the rest indented).</li>
      <li><b>Each entry</b> follows the rules from rounds 1 and 2.</li>
    </ul>
    <p>Tapping something that’s actually correct costs aura.</p>
    <button class="btn" id="go3" data-focus>Show the page</button>
  </section>`);
  $('#go3').onclick=()=>{sfx.tap();round3()};
}
function round3(){
  const spots={
    head:{bad:true,why:'This is MLA’s heading. APA calls the page “References,” in bold, centered.'},
    pnum:{bad:true,why:'Page numbers go in the top right corner, not at the bottom.'},
    carr:{bad:true,why:'“New York, NY:” is a publisher location. APA 7 drops it.'},
    mark:{bad:true,why:'This entry has a first-line indent. APA uses a hanging indent: first line flush left, the rest indented 0.5 inch.'},
    mueller:{bad:true,why:'“doi:10.1177/…” is the old style. Write it as https://doi.org/10.1177/0956797614524581.'},
    haidt:{bad:false,why:'This entry is correct. Italic sentence-case title, publisher, hanging indent.'},
    sparrow:{bad:false,why:'This entry is correct. Three authors, &amp; before the last, DOI as a link.'}
  };
  let found=0;
  go(`<div class="row" style="justify-content:space-between"><div class="counter" style="margin:0">Tap each formatting error.</div><div class="found-count" id="fc">0 / ${ROUND3_GLITCHES} found</div></div>
    <div class="page-wrap"><div class="page" id="page">
      <span class="hot p-num" data-s="pnum">9</span>
      <p class="p-head"><span class="hot" data-s="head">Works Cited</span></p>
      <span class="entry hot" data-s="carr">Carr, N. (2010). <i>The shallows: What the Internet is doing to our brains</i>. New York, NY: W. W. Norton &amp; Company.</span>
      <span class="entry hot" data-s="haidt">Haidt, J. (2024). <i>The anxious generation: How the great rewiring of childhood is causing an epidemic of mental illness</i>. Penguin Press.</span>
      <span class="entry bad-indent hot" data-s="mark">Mark, G. (2023). <i>Attention span: A groundbreaking way to restore balance, happiness and productivity</i>. Hanover Square Press.</span>
      <span class="entry hot" data-s="mueller">Mueller, P. A., &amp; Oppenheimer, D. M. (2014). The pen is mightier than the keyboard: Advantages of longhand over laptop note taking. <i>Psychological Science, 25</i>(6), 1159–1168. doi:10.1177/0956797614524581</span>
      <span class="entry hot" data-s="sparrow">Sparrow, B., Liu, J., &amp; Wegner, D. M. (2011). Google effects on memory: Cognitive consequences of having information at our fingertips. <i>Science, 333</i>(6043), 776–778. https://doi.org/10.1126/science.1207745</span>
    </div></div>
    <div class="note" id="note">Tap anything on the page that breaks APA format.</div>
    <div id="vd"></div>`);
  document.querySelectorAll('.hot').forEach(h=>{
    h.setAttribute('role','button');h.tabIndex=0;
    const act=()=>{
      const key=h.dataset.s,s=spots[key];
      if(h.classList.contains('found')||h.classList.contains('cleared'))return;
      const note=$('#note');
      if(s.bad){
        h.classList.add('found');found++;award(true,120,h);
        note.className='note good';note.innerHTML='<b>Glitch found.</b> '+s.why;
        $('#fc').textContent=found+' / '+ROUND3_GLITCHES+' found';
        if(found===ROUND3_GLITCHES){
          confetti(80);
          $('#vd').innerHTML=`<div class="verdict good" style="margin-top:14px"><h3>Page fixed.</h3><p>You caught every glitch. One more thing worth knowing: in a student paper, the References page starts on its own new page, after the last page of your essay.</p><button class="btn" id="nextBtn">Finish round</button></div>`;
          $('#nextBtn').focus({preventScroll:true});$('#nextBtn').onclick=()=>roundDone(3,brief4);
        }
      } else {
        h.classList.add('cleared');award(false,0,h);
        note.className='note bad';note.innerHTML='<b>Not a glitch.</b> '+s.why;
      }
      say(note.textContent);
    };
    h.onclick=act;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}};
  });
}

/* ===================== ROUND 4 ===================== */
function brief4(){
  setRound(4);
  go(`<section class="panel brief">
    <p class="kicker">Round 4 of 4</p>
    <h2>In-text speedrun</h2>
    <p class="lede">Every source in your paper gets cited in your sentences too. Each question has a 15-second timer, and fast answers earn bonus aura.</p>
    <ul class="rules">
      <li><b>Parenthetical:</b> (Author, Year). Two authors: (Mueller &amp; Oppenheimer, 2014).</li>
      <li><b>Narrative:</b> the names are part of your sentence. Mueller and Oppenheimer (2014) found…</li>
      <li><b>Three or more authors:</b> use “et al.” every time, starting with the first citation.</li>
      <li><b>Direct quotes</b> add a page number: (Author, Year, p. #).</li>
    </ul>
    <p>Press 1–4 on a keyboard to answer faster.</p>
    <button class="btn" id="go4" data-focus>Start the timer</button>
  </section>`);
  $('#go4').onclick=()=>{sfx.tap();round4()};
}
function round4(){
  const qs=shuffle(ROUND4);let i=0,raf=null,locked=false;const LIMIT=15000;
  function show(){
    if(i>=qs.length){document.onkeydown=null;return roundDone(4,endScreen)}
    locked=false;const q=qs[i];
    go(`<div class="counter">Question ${i+1} of ${qs.length}</div>
      <div class="timer" id="tm"><i id="tb"></i></div>
      <p class="q">${q.q}</p>
      ${q.ctx?`<div class="ctx">${q.ctx}</div>`:''}
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${o}</button>`).join('')}</div>
      <div id="vd"></div>`);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
    const t0=performance.now();let lastTick=99;
    cancelAnimationFrame(raf);
    (function loop(now){
      if(locked)return;
      const left=Math.max(0,LIMIT-(now-t0));
      $('#tb').style.width=(left/LIMIT*100)+'%';
      const sec=Math.ceil(left/1000);
      if(sec<=5){$('#tm').classList.add('low');if(sec<lastTick){lastTick=sec;if(sec>0)sfx.tick()}}
      if(left<=0)return answer(-1,null);
      q._left=left;raf=requestAnimationFrame(loop);
    })(t0);
  }
  function answer(k,btn){
    if(locked)return;locked=true;cancelAnimationFrame(raf);
    const q=qs[i],ok=k===q.a;
    document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
    const bonus=ok?Math.round(50*(q._left||0)/LIMIT):0;
    award(ok,100+bonus,btn||$('#tm'));
    const title=k===-1?'Time’s up.':ok?(bonus>=35?'Speedrun pace.':'Correct.'):'Not that one.';
    $('#vd').innerHTML=`<div class="verdict ${ok?'good':'bad'}"><h3>${title}</h3><p>${q.why}</p><button class="btn" id="nextBtn">${i+1<qs.length?'Next question':'See results'}</button></div>`;
    say(title+' '+$('#vd p').textContent);
    $('#nextBtn').focus({preventScroll:true});$('#nextBtn').onclick=()=>{i++;show()};
  }
  document.onkeydown=e=>{if(!locked&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-k="${+e.key-1}"]`);if(b)b.click()}};
  show();
}

/* ===================== ROUND TRANSITIONS ===================== */
function roundDone(n,next){
  sfx.win();confetti();
  $('#rd'+n).className='rd done';
  const lines=['Your reference entries are looking clean.','You can build a reference from scratch now.','That References page is ready to turn in.','In-text citations: handled.'];
  go(`<section class="panel brief" style="text-align:center">
    <p class="kicker">Round ${n} cleared</p>
    <h2>${['','Cards sorted.','Piles built.','Glitches patched.','Speedrun done.'][n]}</h2>
    <p class="lede" style="margin-top:10px">${lines[n-1]} Running total: <b>${S.aura.toLocaleString()} aura</b>, best streak ${S.best}.</p>
    <button class="btn pink" id="goNext" data-focus>${n<4?'Next round':'Get my results'}</button>
  </section>`);
  $('#goNext').onclick=()=>{sfx.tap();next()};
}

/* ===================== END + CERTIFICATE ===================== */
function rankFor(acc){
  if(acc>=90)return 'APA main character';
  if(acc>=75)return 'Citation certified';
  if(acc>=60)return 'Solid, keep practicing';
  return 'Respawn recommended';
}
function code(str){let h=5381;for(const c of str)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'APA-'+h.toString(36).toUpperCase().padStart(7,'0').slice(-7)}
function endScreen(){
  setRound(5);
  const acc=S.attempts?Math.round(S.correct/S.attempts*100):0;
  const rank=rankFor(acc);
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  go(`<section class="panel end">
    <p class="kicker">All four rounds complete</p>
    <h2>You passed the aura check.</h2>
    <div class="rank">${rank}</div>
    <div class="stats">
      <div class="stat"><b>${S.aura.toLocaleString()}</b><span>aura</span></div>
      <div class="stat"><b>${acc}%</b><span>accuracy</span></div>
      <div class="stat"><b>${S.best}</b><span>best streak</span></div>
    </div>
    <label for="nm">Your name for the completion card</label>
    <input type="text" id="nm" maxlength="40" autocomplete="name" placeholder="First and last name">
    <canvas id="certCanvas" width="1200" height="760" aria-label="Completion card preview"></canvas>
    <div class="row">
      <button class="btn pink" id="sendBtn">Send score to instructor</button>
      <button class="btn" id="dlBtn">Download card (PNG)</button>
      <button class="btn blue" id="cpBtn">Copy completion text</button>
      <button class="btn alt" id="againBtn">Play again</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <p id="formLink" hidden></p>
    <label for="txt" style="margin-top:10px">Completion text</label>
    <textarea id="txt" rows="7" readonly></textarea>
  </section>`);
  confetti(200);
  const nm=$('#nm');nm.focus({preventScroll:true});
  const data=()=>{const name=nm.value.trim()||'Student';return{name,acc,rank,date,aura:S.aura,best:S.best,code:code(name+'|'+S.aura+'|'+acc+'|'+date+'|'+S.correct+'/'+S.attempts)}};
  const refresh=()=>{const d=data();drawCert(d);$('#txt').value=certText(d)};
  nm.oninput=refresh;
  (document.fonts?document.fonts.ready:Promise.resolve()).then(refresh);refresh();
  $('#cpBtn').onclick=()=>{if(!nm.value.trim()){needName();return}copyText($('#txt').value)};
  $('#dlBtn').onclick=()=>{if(!nm.value.trim()){needName();return}downloadCert(data())};
  if(!parseForm())$('#sendBtn').hidden=true;
  $('#sendBtn').onclick=()=>{if(!nm.value.trim()){needName();return}submitScore(data())};
  $('#againBtn').onclick=()=>{Object.assign(S,{aura:0,correct:0,attempts:0,streak:0,best:0,lessonDone:false});LESSON.forEach(s=>s._done=false);renderAura();showCombo(1);titleScreen()};
  function needName(){$('#msg').textContent='Add your name first so the card shows who completed it.';nm.focus();sfx.bad()}
}
function certText(d){
  return `✅ Completed: Aura Check, APA Edition (APA 7 citation and format)
Name: ${d.name}
Aura: ${d.aura.toLocaleString()}
Accuracy: ${d.acc}% (${S.correct} of ${S.attempts} correct)
Best streak: ${d.best}
Lesson: ${S.lessonDone?'completed':'skipped'}
Rank: ${d.rank}
Date: ${d.date}
Completion code: ${d.code}`;
}
function drawCert(d){
  const c=$('#certCanvas'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);
  x.fillStyle='#EEE9FF';x.fillRect(0,0,W,H);
  x.fillStyle='#CFC6F5';for(let i=0;i<W;i+=26)for(let j=0;j<H;j+=26){x.beginPath();x.arc(i,j,1.6,0,7);x.fill()}
  // card
  x.fillStyle='#1D1838';rr(x,58,58,W-100,H-100,34);x.fill();
  x.fillStyle='#FFFFFF';rr(x,48,48,W-100,H-100,34);x.fill();
  x.lineWidth=5;x.strokeStyle='#1D1838';rr(x,48,48,W-100,H-100,34);x.stroke();
  // sticker title
  x.save();x.translate(110,128);x.rotate(-.035);
  x.fillStyle='#E8256F';rr(x,0,0,430,86,18);x.fill();x.lineWidth=4;x.stroke();
  x.fillStyle='#fff';x.font='800 50px "Bricolage Grotesque", Arial Black, sans-serif';x.fillText('APA edition',26,60);x.restore();
  x.fillStyle='#1D1838';x.font='800 64px "Bricolage Grotesque", Arial Black, sans-serif';x.fillText('Aura Check',110,112);
  x.font='400 26px "Atkinson Hyperlegible", Arial, sans-serif';x.fillStyle='#5B5580';
  x.fillText(S.lessonDone?'Completed the APA 7 lesson and all four practice rounds':'Completed all four practice rounds (lesson skipped)',110,262);
  x.fillStyle='#1D1838';x.font='800 72px "Bricolage Grotesque", Arial Black, sans-serif';
  fitText(x,d.name,110,355,W-260,72);
  // rank pill
  x.font='800 32px "Bricolage Grotesque", Arial Black, sans-serif';
  const rw=x.measureText(d.rank).width+44;
  x.fillStyle='#F4FF5E';rr(x,110,392,rw,58,14);x.fill();x.lineWidth=4;x.strokeStyle='#1D1838';x.stroke();
  x.fillStyle='#1D1838';x.fillText(d.rank,132,432);
  // stats
  const st=[[d.aura.toLocaleString(),'aura'],[d.acc+'%','accuracy'],[String(d.best),'best streak']];
  st.forEach((s,k)=>{const bx=110+k*250;x.fillStyle='#EEE9FF';rr(x,bx,488,226,112,16);x.fill();x.lineWidth=3;x.stroke();
    x.fillStyle='#1D1838';x.font='800 44px "Bricolage Grotesque", Arial Black, sans-serif';x.fillText(s[0],bx+20,544);
    x.font='400 22px "Atkinson Hyperlegible", Arial, sans-serif';x.fillStyle='#5B5580';x.fillText(s[1],bx+20,580)});
  x.font='700 22px "Atkinson Hyperlegible", Arial, sans-serif';x.fillStyle='#1D1838';
  x.fillText(d.date,110,656);
  x.textAlign='right';x.fillText('Code '+d.code,W-110,656);x.textAlign='left';
  // badge
  x.save();x.translate(W-210,250);x.rotate(.12);
  x.fillStyle='#3047FF';x.beginPath();for(let k=0;k<24;k++){const a=k/24*Math.PI*2,r=k%2?78:92;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.lineWidth=4;x.strokeStyle='#1D1838';x.stroke();
  x.fillStyle='#fff';x.textAlign='center';x.font='800 30px "Bricolage Grotesque", Arial Black, sans-serif';x.fillText('APA 7',0,-4);
  x.font='700 20px "Atkinson Hyperlegible", Arial, sans-serif';x.fillText('complete',0,24);x.restore();x.textAlign='left';
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fitText(x,t,a,b,max,size){let s=size;do{x.font=`800 ${s}px "Bricolage Grotesque", Arial Black, sans-serif`;s-=2}while(x.measureText(t).width>max&&s>24);x.fillText(t,a,b)}

let dlNS;
function getDownloads(){
  if(dlNS!==undefined)return Promise.resolve(dlNS);
  if(!window.claude||typeof window.claude.use!=='function'){dlNS=null;return Promise.resolve(null)}
  return window.claude.use('downloads').then(n=>(dlNS=n)).catch(()=>(dlNS=null));
}
setTimeout(()=>{getDownloads()},0);
function downloadCert(d){
  const msg=$('#msg');msg.textContent='Preparing your card…';
  const fname='aura-check-apa-'+d.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.png';
  $('#certCanvas').toBlob(async blob=>{
    if(!blob){msg.textContent='The card couldn’t be generated. Use the copy button instead.';return}
    const ns=await getDownloads();
    if(ns){
      try{await ns.save({filename:fname,data:blob});msg.textContent='Card saved.';sfx.good()}
      catch(e){msg.textContent=e&&e.code==='declined'?'Download canceled.':'Downloads aren’t available here. Use the copy button instead.'}
      return;
    }
    try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg.textContent='Card downloaded.';sfx.good()}
    catch(e){msg.textContent='Downloads aren’t available here. Use the copy button instead.'}
  },'image/png');
}
function parseForm(){
  if(!FORM_PREFILL_URL)return null;
  try{
    const u=new URL(FORM_PREFILL_URL);
    const m=u.pathname.match(/\/forms\/d\/e\/([^/]+)\//);
    if(!m)return null;
    const map={};
    const alias={'BEST STREAK':'STREAK','COMPLETION CODE':'CODE'};
    u.searchParams.forEach((v,k)=>{if(k.startsWith('entry.')){const key=v.trim().toUpperCase();map[alias[key]||key]=k}});
    if(!Object.keys(map).length)return null;
    return {action:`https://docs.google.com/forms/d/e/${m[1]}/formResponse`,view:`https://docs.google.com/forms/d/e/${m[1]}/viewform`,map};
  }catch(e){return null}
}
async function submitScore(d){
  const f=parseForm(),msg=$('#msg'),link=$('#formLink'),btn=$('#sendBtn');
  if(!f){msg.textContent='Score sending isn’t set up. Download your card instead.';return}
  const vals={NAME:d.name,AURA:String(d.aura),ACCURACY:`${d.acc}% (${S.correct} of ${S.attempts})`,STREAK:String(d.best),RANK:d.rank,LESSON:S.lessonDone?'completed':'skipped',CODE:d.code};
  const body=new URLSearchParams(),q=new URLSearchParams();
  for(const [key,entry] of Object.entries(f.map)){if(vals[key]!=null){body.append(entry,vals[key]);q.append(entry,vals[key])}}
  const prefill=f.view+'?usp=pp_url&'+q.toString();
  btn.disabled=true;msg.textContent='Sending your score…';
  try{
    await fetch(f.action,{method:'POST',mode:'no-cors',body});
    msg.textContent='Score sent to your instructor.';sfx.win();confetti(80);
    link.hidden=false;link.innerHTML=`Want a backup? <a href="${prefill}" target="_blank" rel="noopener">Open the form</a> and press Submit.`;
  }catch(e){
    btn.disabled=false;
    msg.textContent='Your score couldn’t send automatically. Open the form below, check your info, and press Submit.';
    link.hidden=false;link.innerHTML=`<a class="btn blue" style="display:inline-block;text-decoration:none" href="${prefill}" target="_blank" rel="noopener">Open the score form</a>`;
  }
}
async function copyText(t){
  const msg=$('#msg');
  try{await navigator.clipboard.writeText(t);msg.textContent='Copied. Paste it into your Canvas submission.';sfx.good();return}catch(e){}
  const ta=$('#txt');ta.focus();ta.select();
  try{if(document.execCommand('copy')){msg.textContent='Copied. Paste it into your Canvas submission.';sfx.good();return}}catch(e){}
  msg.textContent='Copy didn’t work automatically. The text below is selected, so press Ctrl+C (or ⌘+C).';
}

titleScreen();
</script>
